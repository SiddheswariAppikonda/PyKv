<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PyKV Login</title>

<style>
:root {
    --primary: #2563EB;
    --bg1: #F8FAFC;
    --bg2: #EEF2FF;
    --card: #FFFFFF;
    --text: #0F172A;
    --muted: #64748B;
    --border: #E5E7EB;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
}

.card {
    width: 420px;
    background: var(--card);
    padding: 40px;
    border-radius: 20px;
    box-shadow:
        0 25px 50px rgba(0,0,0,0.08),
        0 10px 20px rgba(0,0,0,0.04);
}

h2 {
    margin: 0;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 28px;
}

input {
    width: 100%;
    padding: 14px 16px;
    margin-top: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 26px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #1D4ED8;
}

.error {
    color: #DC2626;
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
}

.footer {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--muted);
}

.footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="card">
    <h2>🔐 PyKV Store</h2>
    <div class="subtitle">Secure Key-Value Storage System</div>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button type="button" onclick="login()">Login</button>

    <div class="error" id="msg"></div>

    <div class="footer">
        Don’t have an account? <a href="signup.html">Create one</a>
    </div>
</div>

<script>
const username = document.getElementById("username");
const password = document.getElementById("password");
const msg = document.getElementById("msg");

async function login() {
    msg.textContent = "";

    const res = await fetch("http://127.0.0.1:8002/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username: username.value.trim(),
            password: password.value
        })
    });

    const data = await res.json();

    if (res.ok) {
        localStorage.setItem("pykv_auth", "true");
        localStorage.setItem("pykv_user", username.value.trim());
        localStorage.setItem(
            "pykv_login_time",
            new Date().toLocaleString()
        );
        window.location.href = "index.html";
    } else {
        msg.textContent = data.detail || "Login failed";
    }
}
</script>

</body>
</html>
