<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PyKV Signup</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", sans-serif;
}
.card {
    width: 380px;
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
}
h2 {
    text-align: center;
    margin-bottom: 20px;
}
input, button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
}
input:focus {
    outline: none;
    border-color: #4F86F7;
}
button {
    background: #4F86F7;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 18px;
    font-weight: 600;
}
button:hover {
    opacity: 0.9;
}
.error {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
}
.hint {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
}
.footer {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
}
.footer a {
    color: #4F86F7;
    text-decoration: none;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="card">
    <h2>🆕 Create Account</h2>

    <input id="username" placeholder="Choose username">
    <div class="hint">5–15 chars, letters/numbers/_ , must start with a letter</div>

    <input id="password" type="password" placeholder="Choose password">
    <div class="hint">Min 8 chars, upper, lower, number & special char</div>

    <input id="confirmPassword" type="password" placeholder="Confirm password">

    <button type="button" onclick="signup()">Sign Up</button>

    <div class="error" id="msg"></div>

    <div class="footer">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script>
const username = document.getElementById("username");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const msg = document.getElementById("msg");

const usernameRegex = /^[A-Za-z][A-Za-z0-9_]{4,14}$/;
const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

// 🔴 Live confirm-password validation
confirmPassword.addEventListener("input", () => {
    if (confirmPassword.value && confirmPassword.value !== password.value) {
        msg.textContent = "Passwords do not match";
        msg.style.color = "red";
    } else {
        msg.textContent = "";
    }
});

async function signup() {
    msg.textContent = "";

    if (!usernameRegex.test(username.value)) {
        msg.textContent = "Invalid username format";
        msg.style.color = "red";
        return;
    }

    if (!passwordRegex.test(password.value)) {
        msg.textContent = "Password is not strong enough";
        msg.style.color = "red";
        return;
    }

    if (password.value !== confirmPassword.value) {
        msg.textContent = "Passwords do not match";
        msg.style.color = "red";
        return;
    }

    try {
        const res = await fetch("http://127.0.0.1:8002/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: username.value,
                password: password.value
            })
        });

        const data = await res.json();

        if (res.ok) {
            msg.textContent = "Account created successfully 🎉";
            msg.style.color = "green";

            // Redirect after showing success
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);
        } else {
            msg.textContent = data.detail || "Signup failed";
            msg.style.color = "red";
        }
    } catch (error) {
        msg.textContent = "Server not reachable";
        msg.style.color = "red";
    }
}
</script>

</body>
</html>
